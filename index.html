<script>
(() => {

/* ===== Conexión con la base de datos (Supabase). Pegá tus datos según la guía, parte 5 ===== */
const SUPABASE_URL = "https://psacfjwdjoaxgsmqhrqz.supabase.co/rest/v1/";

const sb = (CONFIG_OK && typeof supabase !== "undefined") ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ===== Utilidades ===== */
const DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const ORDEN_DIAS = [1, 2, 3, 4, 5, 6, 0];

const p2 = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;

}

function vInicio() {
  const cats = [...new Set(SERV.map(s => s.categoria))];
  const foto = CFG.foto_principal ? `<img src="${esc(CFG.foto_principal)}" alt="Salón">` : `<div class="placa"><span>ZINNIA</span></div>`;
  const usuario = (CFG.instagram || "").replace(/^@/, "");
  return `
  <section class="hero">
    <h1 class="hero-titulo rv">${esc(CFG.nombre || "ZINNIA HAIR STUDIO")}</h1>
    <p class="lead rv" style="--d:1">${esc(CFG.texto_bienvenida || "")}</p>
    <div class="acc rv" style="--d:2"><a class="btn" href="#reservar">Reservar turno</a><a class="btn" href="#servicios">Ver servicios</a></div>
    <div class="hero-foto rv" style="--d:3" data-parallax>${foto}</div>
  </section>

  <section id="servicios" class="seccion app-seccion">
    <h2 class="titulo-sec rv">Servicios y precios</h2>
    ${SERV.length
      ? cats.map(c => `<h3 class="cat rv">${esc(c)}</h3><div class="cards">${SERV.filter(s => s.categoria === c).map(tarjeta).join("")}</div>`).join("")
      : `<p class="centro">Próximamente publicaremos nuestros servicios.</p>`}
  </section>

  <section id="trabajos" class="seccion">
    <h2 class="titulo-sec rv">Trabajos</h2>
    <div class="trabajos">${GAL.length
      ? GAL.map((g, i) => escena(`<figure class="trabajo" data-zoom="${esc(g.url)}" data-titulo="${esc(g.titulo)}"><span class="trabajo-foto" data-parallax><img src="${esc(g.url)}" alt="${esc(g.titulo)}" loading="lazy"></span><figcaption>${esc(g.titulo)}</figcaption></figure>`, i)).join("")
      : `<p class="centro">Pronto vamos a compartir nuestros trabajos.</p>`}</div>
  </section>

  <section id="contacto" class="seccion">
    <h2 class="titulo-sec rv">Contacto</h2>
    <div class="contacto-grilla">
      ${CFG.direccion ? `<div class="card rv"><h3>Dirección</h3><p>${esc(CFG.direccion)}</p></div>` : ""}
      <div class="card rv"><h3>Horarios</h3><ul class="horarios">${ORDEN_DIAS.map(d => {
        const h = HOR.find(x => x.dia === d);
        return `<li><span>${DIAS[d]}</span><span>${h && h.trabaja ? `${h.abre.slice(0, 5)} a ${h.cierra.slice(0, 5)}` : "Cerrado"}</span></li>`;
      }).join("")}</ul></div>
      <div class="card rv"><h3>Escribinos</h3>
        ${CFG.whatsapp ? `<a class="btn" href="https://wa.me/${esc(CFG.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
        ${usuario ? `<a class="link" href="https://instagram.com/${esc(usuario)}" target="_blank" rel="noopener">@${esc(usuario)}</a>` : ""}
      </div>
    </div>
  </section>`;
}

/* ===== Detalle del servicio: se abre al tocar una tarjeta ===== */
function abrirDetalle(id) {
  const s = SERV.find(x => x.id === id);
  if (!s) return;
  const sh = $("sheet");
  sh.innerHTML = `<div class="sheet-fondo" data-cerrar></div>
    <article class="sheet-panel" role="dialog" aria-modal="true" aria-label="${esc(s.nombre)}">
      <button class="sheet-x" data-cerrar aria-label="Cerrar">×</button>
      <div class="sheet-scroll">
        <div class="sheet-foto"><img src="${esc(s.foto_url)}" alt="${esc(s.nombre)}"></div>
        <p class="kicker">${esc(s.categoria)}</p>
        <h2 class="sheet-titulo">${esc(s.nombre)}</h2>
        ${s.descripcion ? `<p class="sheet-desc">${esc(s.descripcion)}</p>` : ""}
        <dl class="sheet-datos">
          <div><dt>Duración</dt><dd>${fmtDur(s.duracion_min)}</dd></div>
          <div><dt>Precio</dt><dd>${fmtPrecio(s.precio)}</dd></div>
        </dl>
      </div>
      <div class="sheet-accion">
        <button class="btn" data-reservar="${esc(s.id)}">Reservar este servicio</button>
        <button class="link" data-cerrar>Volver</button>
      </div>
    </article>`;
  sh.hidden = false;
  requestAnimationFrame(() => sh.classList.add("abierto"));
}
function cerrarDetalle() {
  const sh = $("sheet");
  if (sh.hidden) return;
  sh.classList.remove("abierto");
  setTimeout(() => { sh.hidden = true; sh.innerHTML = ""; }, 420);
}
function preseleccionar(id) {
  const s = SERV.find(x => x.id === id);
  if (!s) return;
  R.servicio = s;
  Object.assign(R, { paso: 2, fecha: null, hora: null, horas: [], error: "", resultado: null });
  cerrarDetalle();
  if (location.hash === "#reservar") render(); else location.hash = "#reservar";
}

/* ===== Reserva ===== */
function pasoServicio() {
  if (!SERV.length) return `<p class="centro">No hay servicios disponibles por ahora.</p>`;
  const cats = [...new Set(SERV.map(s => s.categoria))];
  return `<div class="filtros">${["", ...cats].map(c => `<button class="chip ${R.cat === c ? "on" : ""}" data-cat="${esc(c)}">${c || "Todos"}</button>`).join("")}</div>
    <div class="grilla">${SERV.filter(s => !R.cat || s.categoria === R.cat).map(s => `
      <button class="opt ${R.servicio && R.servicio.id === s.id ? "sel" : ""}" data-servicio="${esc(s.id)}">
        <span class="opt-n">${esc(s.nombre)}</span><span class="opt-m">${fmtDur(s.duracion_min)} · ${fmtPrecio(s.precio)}</span>
      </button>`).join("")}</div>`;
}
function pasoFecha() {
  const base = R.mes, y = base.getFullYear(), m = base.getMonth();
  const hoyD = hoy(), lim = addDias(hoyD, 90);
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  const dias = new Date(y, m + 1, 0).getDate();
  const celdas = [...Array(lead).fill(null), ...Array.from({ length: dias }, (_, i) => new Date(y, m, i + 1))];
  const atras = new Date(y, m, 1) > new Date(hoyD.getFullYear(), hoyD.getMonth(), 1);
  const adelante = new Date(y, m + 1, 1) <= lim;
  return `<div class="cal-nav">
      <button class="link" data-mes="-1" ${atras ? "" : "disabled"} aria-label="Mes anterior">‹</button>
      <span>${base.toLocaleDateString("es-AR", { month: "long", year: "numeric" })}</span>
      <button class="link" data-mes="1" ${adelante ? "" : "disabled"} aria-label="Mes siguiente">›</button>
    </div>
    <div class="cal-sem">${["L", "M", "X", "J", "V", "S", "D"].map(d => `<span>${d}</span>`).join("")}</div>
    <div class="cal">${celdas.map(d => {
      if (!d) return `<span></span>`;
      const dis = d < hoyD || d > lim || !diaAbierto(d);
      return `<button class="dia ${R.fecha === iso(d) ? "sel" : ""}" data-dia="${iso(d)}" ${dis ? "disabled" : ""}>${d.getDate()}</button>`;
    }).join("")}</div>
    <p class="ayuda">Los días tachados no tienen atención.</p>
    <div class="acc"><button class="btn" data-paso="1">Volver</button></div>`;
}
function pasoHora() {
  if (R.cargando) return `<p class="centro">Buscando horarios…</p>`;
  if (!R.horas.length) return `<p class="centro">No quedan horarios disponibles ese día.</p>
    <div class="acc"><button class="btn" data-paso="2">Elegir otro día</button></div>`;
  return `<div class="slots">${R.horas.map(h => `<button class="slot ${R.hora === h ? "sel" : ""}" data-hora="${h}">${h}</button>`).join("")}</div>
    <div class="acc"><button class="btn" data-paso="2">Volver</button></div>`;
}
function pasoDatos() {
  return `<form class="form" data-form="datos" novalidate>
    <label>Nombre y apellido<input name="nombre" autocomplete="name" maxlength="80" value="${esc(R.nombre)}"></label>
    <label>Número de teléfono<input name="telefono" inputmode="tel" autocomplete="tel" placeholder="Con código de área" value="${esc(R.telefono)}"></label>
    <p class="ayuda">Tu teléfono nos sirve para confirmar y ubicar tu turno.</p>
    <div class="acc"><button class="btn" type="button" data-paso="3">Volver</button><button class="btn" type="submit">Continuar</button></div>
  </form>`;
}
const filasResumen = r => `<dl>
  <div><dt>Servicio</dt><dd>${esc(r.servicio)}</dd></div>
  <div><dt>Fecha</dt><dd>${fmtFecha(r.fecha)}</dd></div>
  <div><dt>Horario</dt><dd>${esc(r.hora)} hs · ${fmtDur(r.duracion_min)}</dd></div>
  <div><dt>Precio</dt><dd>${fmtPrecio(r.precio)}</dd></div>
  <div><dt>Nombre</dt><dd>${esc(r.nombre)}</dd></div>
</dl>`;
function pasoRevisar() {
  const r = { servicio: R.servicio.nombre, fecha: R.fecha, hora: R.hora, duracion_min: R.servicio.duracion_min, precio: R.servicio.precio, nombre: R.nombre };
  return `<div class="card revision">${filasResumen(r)}</div>
    <div class="acc"><button class="btn" data-paso="4">Corregir</button>
    <button class="btn" data-act="confirmar" ${R.cargando ? "disabled" : ""}>${R.cargando ? "Confirmando…" : "Confirmar turno"}</button></div>`;
}
// Mensaje con el formato de la reserva para el salón. Se usa en el enlace de WhatsApp (wa.me).
const PRUEBA_DEMO = false; // en la versión real queda en false
function mensajeSalon(r) {
  return [
    `${PRUEBA_DEMO ? "[PRUEBA] " : ""}NUEVA RESERVA — ${CFG.nombre || "ZINNIA HAIR STUDIO"}`,
    "",
    `Cliente: ${r.nombre}`,
    `Teléfono: ${normTel(R.telefono)}`,
    `Servicio: ${r.servicio}`,
    `Fecha: ${fmtCorta(r.fecha)}`,
    `Horario: ${r.hora} hs`,
    `Precio: ${fmtPrecio(r.precio)}`
  ].join("\n");
}
function vConfirmado() {
  const r = R.resultado;
  const url = `https://wa.me/${CFG.whatsapp || ""}?text=${encodeURIComponent(mensajeSalon(r))}`;
  return `<section class="bloque centro">
    <svg class="check" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg>
    <p class="kicker">Turno confirmado</p>
    <h1 class="titulo">¡Te esperamos!</h1>
    <div class="card revision" style="margin-bottom:28px">${filasResumen(r)}</div>
    <div class="acc col">
      ${CFG.whatsapp ? `<a class="btn" href="${url}" target="_blank" rel="noopener">Avisar al salón por WhatsApp</a>
      <p class="ayuda">Se abre WhatsApp con los datos de tu turno. Tocá «Enviar» para avisarnos.</p>` : ""}
      <button class="btn" data-act="ics">Agregar al calendario</button>
      <button class="link" data-act="nuevo">Hacer otra reserva</button>
    </div>
  </section>`;
}
let pasoVisto = 0;
function vReservar() {
  if (R.paso === 6 && R.resultado) return vConfirmado();
  const entra = pasoVisto !== R.paso; pasoVisto = R.paso;
  const barra = R.servicio
    ? `<div class="resumen">${esc(R.servicio.nombre)} · ${fmtDur(R.servicio.duracion_min)} · ${fmtPrecio(R.servicio.precio)}${R.fecha ? " · " + fmtCorta(R.fecha) : ""}${R.hora ? " · " + R.hora + " hs" : ""}</div>`
    : "";
  const cuerpo = [pasoServicio, pasoFecha, pasoHora, pasoDatos, pasoRevisar][R.paso - 1]();
  return `<section class="bloque ${entra ? "paso-in" : ""}">
    <p class="kicker">Paso ${R.paso} de 5 · ${PASOS[R.paso - 1]}</p>
    ${barra}
    ${R.error ? `<p class="error" role="alert">${esc(R.error)}</p>` : ""}
    ${cuerpo}
  </section>`;
}
async function cargarHoras() {
  R.cargando = true; R.horas = []; render();
  const { data, error } = await sb.rpc("disponibilidad", { p_servicio: R.servicio.id, p_fecha: R.fecha });
  R.cargando = false;
  R.horas = error ? [] : (data || []).map(x => String(x.hora_disponible).slice(0, 5));
  if (error) R.error = "No pudimos cargar los horarios. Revisá tu conexión y probá de nuevo.";
  render();
}
async function confirmar() {
  if (R.cargando) return;
  R.cargando = true; R.error = ""; render();
  const { data, error } = await sb.rpc("crear_turno", {
    p_servicio: R.servicio.id, p_fecha: R.fecha, p_hora: R.hora, p_nombre: R.nombre, p_telefono: normTel(R.telefono)
  });
  R.cargando = false;
  if (error) {
    const msg = error.message || "No pudimos confirmar tu turno. Probá de nuevo.";
    if (/horario|reservado/i.test(msg)) { R.paso = 3; R.hora = null; R.error = msg; render(); return cargarHoras(); }
    R.paso = 5; R.error = msg; return render();
  }
  R.resultado = data; R.paso = 6; R.error = ""; render();
}
function icsDe(r) {
  const [y, m, d] = r.fecha.split("-").map(Number), [hh, mm] = r.hora.split(":").map(Number);
  const ini = new Date(y, m - 1, d, hh, mm), fin = new Date(ini.getTime() + r.duracion_min * 60000);
  const f = x => `${x.getFullYear()}${p2(x.getMonth() + 1)}${p2(x.getDate())}T${p2(x.getHours())}${p2(x.getMinutes())}00`;
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//ZINNIA//Turnos//ES", "BEGIN:VEVENT",
    `UID:${r.id}@zinnia`, `DTSTAMP:${f(new Date())}`, `DTSTART:${f(ini)}`, `DTEND:${f(fin)}`,
    `SUMMARY:${r.servicio} · ZINNIA HAIR STUDIO`, `LOCATION:${CFG.direccion || ""}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
}
function descargarIcs() {
  const blob = new Blob([icsDe(R.resultado)], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "turno-zinnia.ics"; a.click();
}
function reiniciarReserva() {
  Object.assign(R, { paso: 1, servicio: null, fecha: null, hora: null, nombre: "", telefono: "", horas: [], error: "", resultado: null, cargando: false });
}

/* ===== Zoom de fotos ===== */
function abrirZoom(src, titulo) {
  const lb = $("lightbox");
  lb.innerHTML = `<img src="${esc(src)}" alt="${esc(titulo)}"><p>${esc(titulo)}</p>`;
  lb.hidden = false;
}

/* ===== Render y navegación ===== */
const RUTAS_INICIO = ["servicios", "trabajos", "contacto"];
let ultimaRuta = null;
let LISTO = false, ERROR_CARGA = false;
function render() {
  if (!sb) { $("app").innerHTML = `<section class="bloque centro"><h2>Falta conectar la base de datos</h2><p>Seguí la parte 5 de la guía.</p></section>`; return; }
  if (ERROR_CARGA) { $("app").innerHTML = `<section class="bloque centro"><p>No pudimos cargar la información. Probá de nuevo en unos minutos.</p></section>`; return; }
  if (!LISTO) { $("app").innerHTML = `<p class="cargando">Cargando…</p>`; return; }
  const ruta = (location.hash || "#inicio").replace("#", "") || "inicio";
  const reserva = ruta === "reservar";
  $("app").innerHTML = reserva ? vReservar() : vInicio();
  if (!reserva && RUTAS_INICIO.includes(ruta)) {
    const destino = $(ruta);
    if (destino && destino.scrollIntoView) destino.scrollIntoView({ behavior: "smooth", block: "start" });
  } else if (ruta !== ultimaRuta) {
    window.scrollTo(0, 0);
  }
  ultimaRuta = ruta;
  observar();
  alScroll();
}
function observar() {
  if (!("IntersectionObserver" in window)) return document.querySelectorAll(".rv").forEach(el => el.classList.add("in"));
  const io = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
  }), { threshold: 0.12 });
  document.querySelectorAll(".rv:not(.in)").forEach(el => io.observe(el));
}

/* ===== Movimiento al desplazarse: foco, escala y 3D ===== */
function actualizarEfectos() {
  if (reducido() || (location.hash === "#reservar")) return;
  const vh = window.innerHeight || 800;
  document.querySelectorAll("[data-parallax]").forEach(el => {
    const r = el.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (vh - r.top) / (vh + r.height)));
    const d = Math.abs(p - 0.5);
    el.style.filter = `blur(${(d * 9).toFixed(2)}px)`;
    if (el.firstElementChild) el.firstElementChild.style.transform = `scale(${(1 + d * 0.16).toFixed(3)})`;
  });
  document.querySelectorAll("[data-escena]").forEach(el => {
    const r = el.getBoundingClientRect();
    const d = Math.max(-1, Math.min(1, ((vh - r.top) / (vh + r.height) - 0.5) * 2));
    el.style.transform = `rotateX(${(-d * 9).toFixed(2)}deg) scale(${(1 - Math.abs(d) * 0.05).toFixed(3)})`;
  });
  const cab = $("cabecera");
  if (cab) cab.classList.toggle("con-sombra", (window.scrollY || 0) > 10);
}
let pendiente = false;
function alScroll() {
  if (pendiente) return;
  pendiente = true;
  requestAnimationFrame(() => { pendiente = false; actualizarEfectos(); });
}

/* ===== Interacción ===== */
const cerca = (e, sel) => (e.target && e.target.closest) ? e.target.closest(sel) : null;
document.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const t = cerca(e, ".tarjeta"); if (!t) return;
  const r = t.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
  t.style.setProperty("--rx", (-y * 8).toFixed(2) + "deg");
  t.style.setProperty("--ry", (x * 10).toFixed(2) + "deg");
});
const PRESIONABLE = "button, a.btn, a.link, .menu a";
document.addEventListener("pointerdown", e => { const b = cerca(e, PRESIONABLE); if (b && !b.disabled) b.classList.add("presionado"); });
const soltar = e => {
  const b = cerca(e, PRESIONABLE);
  if (b && !(e.relatedTarget && b.contains(e.relatedTarget))) b.classList.remove("presionado");
  const t = cerca(e, ".tarjeta");
  if (t && !(e.relatedTarget && t.contains(e.relatedTarget))) { t.style.setProperty("--rx", "0deg"); t.style.setProperty("--ry", "0deg"); }
};
document.addEventListener("pointerup", soltar);
document.addEventListener("pointercancel", soltar);
document.addEventListener("pointerout", soltar);

document.addEventListener("click", e => {
  if (cerca(e, "[data-cerrar]")) return cerrarDetalle();
  const res = cerca(e, "[data-reservar]");
  if (res) return preseleccionar(res.dataset.reservar);
  const det = cerca(e, "[data-detalle]");
  if (det) return abrirDetalle(det.dataset.detalle);
  const zoom = cerca(e, "[data-zoom]");
  if (zoom) return abrirZoom(zoom.dataset.zoom, zoom.dataset.titulo);
  const b = cerca(e, "[data-servicio],[data-cat],[data-mes],[data-dia],[data-hora],[data-paso],[data-act],[data-review]");
  if (!b) return;
  const ds = b.dataset;
  if (ds.servicio !== undefined) { R.servicio = SERV.find(s => s.id === ds.servicio) || null; Object.assign(R, { paso: 2, fecha: null, hora: null, horas: [], error: "" }); return render(); }
  if (ds.cat !== undefined) { R.cat = ds.cat; return render(); }
  if (ds.mes) { R.mes = new Date(R.mes.getFullYear(), R.mes.getMonth() + Number(ds.mes), 1); return render(); }
  if (ds.dia) { R.fecha = ds.dia; R.paso = 3; R.hora = null; R.error = ""; return cargarHoras(); }
  if (ds.hora) { R.hora = ds.hora; R.paso = 4; R.error = ""; return render(); }
  if (ds.paso) { R.paso = Number(ds.paso); R.error = ""; return render(); }
  if (ds.act === "confirmar") return confirmar();
  if (ds.act === "ics") return descargarIcs();
  if (ds.act === "nuevo") { reiniciarReserva(); return render(); }
});
document.addEventListener("submit", e => {
  if (!e.target || e.target.dataset.form !== "datos") return;
  e.preventDefault();
  const f = new FormData(e.target);
  R.nombre = String(f.get("nombre") || "").trim();
  R.telefono = String(f.get("telefono") || "").trim();
  R.error = validarDatos(R.nombre, R.telefono);
  if (!R.error) R.paso = 5;
  render();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { cerrarDetalle(); $("lightbox").hidden = true; } });
$("lightbox").addEventListener("click", () => { $("lightbox").hidden = true; });

/* ===== Arranque ===== */
async function iniciar() {
  if (!sb) { render(); return; }
  const [c, s, h, e, g] = await Promise.all([
    sb.from("config").select("clave,valor"),
    sb.from("servicios").select("*").eq("activo", true).order("orden").order("nombre"),
    sb.from("horarios_semana").select("*"),
    sb.from("excepciones").select("*").gte("fecha", iso(hoy())),
    sb.from("galeria").select("*").order("orden")
  ]);
  if (c.error || s.error || h.error || e.error || g.error) { ERROR_CARGA = true; render(); return; }
  CFG = Object.fromEntries((c.data || []).map(x => [x.clave, x.valor]));
  SERV = s.data || []; HOR = h.data || []; EXC = e.data || []; GAL = g.data || [];
  LISTO = true;
  render();
}

// Los menús responden siempre, aunque los datos todavía no hayan llegado
window.addEventListener("hashchange", render);
window.addEventListener("scroll", alScroll, { passive: true });
iniciar();
})();
</script>
</body>
